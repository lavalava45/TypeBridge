<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TypeBridge — extensible keyboard layout correction for Windows</title>
  <desc id="desc">Three illustrative Russian, English and Hebrew layout corrections. These are included examples, not a limit on supported language packs. Choose one to three active languages.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#14161c"/>
      <stop offset=".53" stop-color="#0b0c11"/>
      <stop offset="1" stop-color="#1d1018"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff6165"/>
      <stop offset=".55" stop-color="#f93243"/>
      <stop offset="1" stop-color="#c91e34"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#23252c"/>
      <stop offset="1" stop-color="#15171d"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#441b29"/>
      <stop offset="1" stop-color="#2b131e"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#back)"/>
  <path d="M1110 0 H1600 V120 C1410 112 1260 180 1110 240Z" fill="#8d1727" opacity=".13"/>
  <path d="M-40 920 Q300 875 730 935 T1640 888" fill="none" stroke="#ef3044" stroke-width="18" opacity=".30"/>
  <path d="M1050 940 Q1400 820 1700 880" fill="none" stroke="#9f1c2c" stroke-width="90" opacity=".19"/>

  <!-- Wordmark and distinct brand mark -->
  <rect x="82" y="62" width="110" height="110" rx="25" fill="#e02c40" opacity=".38" filter="url(#softGlow)"/>
  <rect x="82" y="62" width="110" height="110" rx="25" fill="url(#red)"/>
  <rect x="89" y="69" width="96" height="96" rx="19" fill="#161820"/>
  <text x="137" y="133" font-family="Segoe UI, Arial, sans-serif" font-size="49" font-style="italic" font-weight="850" text-anchor="middle" fill="#fff">TB</text>
  <text x="232" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="94" font-weight="800" letter-spacing="-4" fill="#fff">Type</text>
  <text x="460" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="94" font-weight="800" letter-spacing="-4" fill="url(#red)">Bridge</text>
  <text x="233" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="29" fill="#e8e9ef">Keyboard layout correction for Windows</text>
  <path d="M82 228 H1518" stroke="#555963" stroke-opacity=".62"/>
  <text x="84" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#d5d7de">3 languages included</text>
  <text x="359" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#fa4a5a">·</text>
  <text x="383" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="25" fill="#d5d7de">Extend with verified language packs</text>

  <!-- Examples are deliberately labeled as examples, not a complete language list -->
  <rect x="82" y="300" width="890" height="440" rx="27" fill="url(#panel)" stroke="#555963" stroke-width="2"/>
  <path d="M110 301 H944" stroke="#f13447" stroke-width="3" opacity=".72"/>
  <text x="119" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="1.2" fill="#fff">EXAMPLES</text>
  <text x="281" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="23" letter-spacing="1" fill="#adb1bc">· BUILT-IN LANGUAGES</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="750" text-anchor="middle">
    <rect x="116" y="365" width="340" height="102" rx="18" fill="#30323a" stroke="#70737e" stroke-width="2"/>
    <rect x="585" y="365" width="353" height="102" rx="18" fill="url(#result)" stroke="#d64455" stroke-width="2"/>
    <text x="286" y="435" fill="#fff">ghbdtn</text>
    <text x="761" y="435" fill="#fff">привет</text>
    <path d="M490 414 H546 M530 395 L550 414 530 433" fill="none" stroke="#dfe0e6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="116" y="484" width="340" height="102" rx="18" fill="#30323a" stroke="#70737e" stroke-width="2"/>
    <rect x="585" y="484" width="353" height="102" rx="18" fill="url(#result)" stroke="#d64455" stroke-width="2"/>
    <text x="286" y="552" fill="#fff">руддщ</text>
    <text x="761" y="552" fill="#fff">hello</text>
    <path d="M490 533 H546 M530 514 L550 533 530 552" fill="none" stroke="#dfe0e6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="116" y="603" width="340" height="102" rx="18" fill="#30323a" stroke="#70737e" stroke-width="2"/>
    <rect x="585" y="603" width="353" height="102" rx="18" fill="url(#result)" stroke="#d64455" stroke-width="2"/>
    <text x="286" y="671" fill="#fff">akuo</text>
    <text x="761" y="672" fill="#fff">שלום</text>
    <path d="M490 652 H546 M530 633 L550 652 530 671" fill="none" stroke="#dfe0e6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Language extensibility: no unverified languages presented as built in -->
  <rect x="1004" y="300" width="514" height="440" rx="27" fill="url(#panel)" stroke="#4f525d" stroke-width="2"/>
  <path d="M1057 359 l35 -19 35 19 -35 19z M1057 374 l35 19 35 -19 M1057 388 l35 19 35 -19" fill="none" stroke="#fb4555" stroke-width="5" stroke-linejoin="round"/>
  <text x="1155" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="#fff">More languages</text>
  <text x="1155" y="394" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="#fff">through packs</text>
  <text x="1052" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#c8cbd4">Included: RU · EN · HE</text>
  <text x="1052" y="501" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#c8cbd4">Additional verified packs can</text>
  <text x="1052" y="535" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#c8cbd4">expand your language choices.</text>
  <rect x="1041" y="602" width="440" height="88" rx="17" fill="#3b1925" stroke="#f24454" stroke-width="3"/>
  <circle cx="1091" cy="646" r="19" fill="none" stroke="#ff5967" stroke-width="3"/>
  <circle cx="1091" cy="646" r="7" fill="#ff5967"/>
  <text x="1128" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#fff">Choose 1–3 active languages</text>

  <!-- Scannable feature line -->
  <path d="M82 785 H1518" stroke="#57515a"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing=".4" fill="#f4f4f8">
    <path d="M125 810 L108 846 H129 L119 873 157 832 H134 L146 810Z" fill="#f43d50"/>
    <text x="178" y="850">AUTO CORRECTION</text>
    <path d="M565 818 l30 -17 30 17 -30 17z M565 832 l30 17 30 -17 M565 846 l30 17 30 -17" fill="none" stroke="#f43d50" stroke-width="4"/>
    <text x="654" y="850">EXTENSIBLE LANGUAGES</text>
    <path d="M1280 809 l29 12 v21 q-5 21 -29 31 -24 -10 -29 -31 v-21z" fill="none" stroke="#f43d50" stroke-width="4"/>
    <path d="M1267 840 l10 10 17 -19" fill="none" stroke="#f43d50" stroke-width="4"/>
    <text x="1330" y="850">LOCAL-FIRST</text>
  </g>
</svg>
