name: Windows portable release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

# Windows runners otherwise use cp1252 for redirected Python output. Tests
# and dictionary reports contain Cyrillic/Hebrew even on English runners.
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Configure runner keyboard layouts for self-test
        run: |
          powershell.exe -NoProfile -NonInteractive -Command '$languages = New-WinUserLanguageList en-US; $languages.Add("ru-RU"); $languages.Add("he-IL"); Set-WinUserLanguageList $languages -Force'
          if ($LASTEXITCODE -ne 0) { throw 'Runner language setup failed' }
      - name: Build and verify public package
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $version = "0.0.0-dev.$env:BUILD_NUMBER"
          if ($env:RELEASE_REF.StartsWith('refs/tags/v')) {
            $version = $env:RELEASE_NAME.Substring(1)
          }
          $output = Join-Path $env:RUNNER_TEMP 'typebridge-release'
          python -c "import ctypes, runpy; u=ctypes.WinDLL('user32'); u.LoadKeyboardLayoutW.argtypes=[ctypes.c_wchar_p,ctypes.c_uint]; u.LoadKeyboardLayoutW.restype=ctypes.c_void_p; handles=[u.LoadKeyboardLayoutW(k,0x80) for k in ('00000409','00000419','0000040D')]; assert all(handles), handles; runpy.run_path('build_public_release.py',run_name='__main__')" --output-dir $output --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Public package build failed' }
      - name: Keep verified download files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TypeBridge-windows-x64
          path: |
            ${{ runner.temp }}/typebridge-release/TypeBridge-*-windows-x64.zip
            ${{ runner.temp }}/typebridge-release/SHA256SUMS.txt
            ${{ runner.temp }}/typebridge-release/BUILD-MANIFEST.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'typebridge-release'
          $files = @(Get-ChildItem -LiteralPath $output -File | Where-Object {
            $_.Name -like 'TypeBridge-*-windows-x64.zip' -or
            $_.Name -in @('SHA256SUMS.txt', 'BUILD-MANIFEST.json')
          } | ForEach-Object { $_.FullName })
          if ($files.Count -ne 3) { throw 'Expected ZIP, checksums and manifest' }
          $options = @('--verify-tag', '--title', "TypeBridge $env:RELEASE_TAG — Windows x64")
          $notes = Join-Path $env:GITHUB_WORKSPACE "docs/releases/$($env:RELEASE_TAG.Substring(1)).md"
          if (Test-Path -LiteralPath $notes) {
            $options += @('--notes-file', $notes)
          } else {
            $options += @('--generate-notes')
          }
          if ($env:RELEASE_TAG.Contains('-')) { $options += @('--prerelease', '--latest=false') }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'Release already exists; refusing to overwrite published assets'
          }
          gh release create $env:RELEASE_TAG @files @options
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Keep build failure log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TypeBridge-build-log
          path: |
            ${{ runner.temp }}/typebridge-release/pyinstaller.log
            ${{ runner.temp }}/typebridge-release/self-test.json
          if-no-files-found: ignore
